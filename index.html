<style>
  html,body{background:#020617}
  /* Pantalla de arranque de la app instalada: logo REDONDO palpitante (SVG en línea = aparece en el primer dibujo) */
  #splashApp{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;background:#020617;align-items:center;justify-content:center;transition:opacity .7s ease}
  html.app-inst #splashApp{display:flex}
  #splashApp.fuera{opacity:0;pointer-events:none}
  #splashApp .ico{position:relative;width:132px;height:132px}
  #splashApp .ico svg{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 0 30px rgba(109,31,217,.6);animation:latidoApp 1.3s ease-in-out infinite}
  #splashApp .ico::before,#splashApp .ico::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(139,92,246,.75);animation:ondaApp 1.3s ease-out infinite}
  #splashApp .ico::after{animation-delay:.4s}
  @keyframes latidoApp{0%{transform:scale(1)}14%{transform:scale(1.15)}28%{transform:scale(1)}42%{transform:scale(1.09)}70%,100%{transform:scale(1)}}
  @keyframes ondaApp{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.9);opacity:0}}
  @media (prefers-reduced-motion:reduce){#splashApp .ico svg,#splashApp .ico::before,#splashApp .ico::after{animation:none}}
</style>
<!-- 1) Detecta lo antes posible si está abierta como app instalada (antes del primer dibujo) -->
<script>
(function () {
  var h = document.documentElement;
  var st = !!(window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches));
  var ios = navigator.standalone === true;
  if (st || ios) h.classList.add("app-inst");
  if (ios) h.classList.add("app-ios");
})();
</script>
<!-- 2) Íconos y manifest: se generan DESPUÉS del primer dibujo para no retrasar el arranque -->
<script>
(function () {
  var PWA = {
    nombre:       "CIE10",     // nombre bajo el ícono al instalar
    colorFondo:   "#e8fdf2",    // fondo del ícono (verde menta)
    colorBorde:   "#6ee7b7",    // aro del ícono (verde claro)
    colorGlifo:   "#178858",    // hélice de ADN (verde oscuro)
    fondoApp:     "#020617",    // color de la pantalla de arranque de la app
    fondoArranque:"#020617"     // fondo del arranque nativo de Android: NEGRO (el ícono redondo "any" tiene esquinas transparentes, así solo se ve el círculo)
  };

  // ---- Dibuja el ícono (hélice de ADN sobre fondo menta con aro verde) y lo devuelve como imagen PNG ----
  function icono(px, forma, glifo) {
    var c = document.createElement("canvas"); c.width = c.height = px;
    var x = c.getContext("2d"), k = px / 512;
    x.scale(k, k);
    if (forma === "mascara") {   // maskable: círculo sobre el MISMO negro del arranque nativo (así, aunque Android use este ícono en el arranque, no se ve ningún cuadro)
      x.fillStyle = PWA.fondoArranque; x.fillRect(0, 0, 512, 512);
      x.translate(256, 256); x.scale(.88, .88); x.translate(-256, -256);

        cx.beginPath(); cx.arc(q.x, q.y, q.r, 0, 6.283); cx.fill();
      }
      if (!quieto) { t++; if ($("cargando").style.display !== "none") requestAnimationFrame(dibujar); }
    }
    window.addEventListener("resize", medir);
    medir(); dibujar();
  })();

  /* ---------- Progreso y mensajes de estado ---------- */
  var progreso = 0, listo = false, cerrando = false;
  var fases = [[0, "INICIANDO NÚCLEO"], [18, "CONECTANDO SERVIDOR"], [42, "SINCRONIZANDO DATOS"], [66, "CARGANDO MÓDULOS"], [84, "CASI LISTO"], [100, "SISTEMA EN LÍNEA"]];
  function pintar() {
    var v = Math.floor(progreso), e = fases[0][1];
    for (var i = 0; i < fases.length; i++) if (v >= fases[i][0]) e = fases[i][1];
    $("relleno").style.width = progreso + "%";
    $("pct").textContent = v + "%";
    $("estado").textContent = e;
  }
  var reloj = setInterval(function () {
    if (!listo) progreso += Math.max(.08, (90 - progreso) * .025);
    else progreso = Math.min(100, progreso + 4);
    pintar();
    if (listo && progreso >= 100 && !cerrando) {
      cerrando = true; clearInterval(reloj);
      setTimeout(function () {
        var c = $("cargando"); c.classList.add("salir");
        setTimeout(function () { c.style.display = "none"; }, 750);
      }, 350);
    }
  }, 60);

  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(URL_APPS_SCRIPT)) {
    clearInterval(reloj);
    document.querySelector(".panel").style.display = "none";
    $("ayuda").innerHTML = "FALTA CONFIGURAR LA URL<br>Edita este archivo y pega la URL /exec en <b>URL_APPS_SCRIPT</b>";
    $("ayuda").style.opacity = "1";
  } else {
    // Se conserva lo que venga después del "?" (por ejemplo ?verificar=SOL-...)
    var destino = URL_APPS_SCRIPT + (location.search || "");
    var marco = $("app");
    marco.src = destino;
    $("directo").href = destino;
    marco.addEventListener("load", function () { listo = true; });
    setTimeout(function () { $("ayuda").style.opacity = "1"; }, 9000);
  }

  /* ---------- Pie de marca: circuito digital con pulsos eléctricos ---------- */
  (function () {
    var cv = $("pieFx"); if (!cv) return;
    var cx = cv.getContext("2d"), W = 0, H = 0, DPR = 1, trazos = [], pulsos = [], last = 0, corriendo = false;
    var quieto = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var COL = ["34,211,238", "59,130,246", "139,92,246"];
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function medir() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      if (!W || !H) return;
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
      trazos = []; pulsos = [];
      var filas = Math.max(4, Math.round(H / 9));
      for (var r = 0; r < filas; r++) {
        var y = 4 + (H - 8) * r / (filas - 1), x = -10, pts = [[x, y]], col = COL[r % 3];
        while (x < W + 10) {
          x += rnd(18, 60); pts.push([x, y]);
          if (Math.random() < .55) {
            var dy = (Math.random() < .5 ? -1 : 1) * rnd(5, 11);
            if (y + dy < 3 || y + dy > H - 3) dy = -dy;
            x += Math.abs(dy); y += dy; pts.push([x, y]);
          }
        }
        var acum = [0], tot = 0;
        for (var i = 1; i < pts.length; i++) {
          tot += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); acum.push(tot);
        }
        trazos.push({ pts: pts, acum: acum, tot: tot, col: col });
        var n = Math.random() < .6 ? 1 : 2;
        for (var k = 0; k < n; k++) pulsos.push({ t: trazos.length - 1, s: rnd(0, tot), v: rnd(50, 130), len: rnd(24, 46) });
      }
      dibujar(0);
    }
    function punto(tr, s) {
      var a = tr.acum, i = 1;
      while (i < a.length - 1 && a[i] < s) i++;
      var f = (s - a[i - 1]) / ((a[i] - a[i - 1]) || 1);
      return [tr.pts[i - 1][0] + (tr.pts[i][0] - tr.pts[i - 1][0]) * f, tr.pts[i - 1][1] + (tr.pts[i][1] - tr.pts[i - 1][1]) * f];
    }
    function dibujar(dt) {
      cx.clearRect(0, 0, W, H);
      var i, j, tr;
      // pistas tenues + nodos
      for (i = 0; i < trazos.length; i++) {
        tr = trazos[i];
        cx.strokeStyle = "rgba(" + tr.col + ",.20)"; cx.lineWidth = 1;
        cx.beginPath(); cx.moveTo(tr.pts[0][0], tr.pts[0][1]);
        for (j = 1; j < tr.pts.length; j++) cx.lineTo(tr.pts[j][0], tr.pts[j][1]);
        cx.stroke();
        cx.fillStyle = "rgba(" + tr.col + ",.45)";
        for (j = 1; j < tr.pts.length - 1; j += 2) { cx.beginPath(); cx.arc(tr.pts[j][0], tr.pts[j][1], 1.3, 0, 6.283); cx.fill(); }
      }
      // pulsos eléctricos con estela
      for (i = 0; i < pulsos.length; i++) {
        var p = pulsos[i]; tr = trazos[p.t];
        if (!quieto) { p.s += p.v * dt; if (p.s > tr.tot + p.len) { p.s = -rnd(0, 80); p.v = rnd(50, 130); } }
        if (quieto && p.s < 0) continue;
        var pasos = 9, prev = null;
        for (j = 0; j <= pasos; j++) {
          var s = p.s - p.len * (1 - j / pasos);
          if (s < 0 || s > tr.tot) { prev = null; continue; }
          var q = punto(tr, s);
          if (prev) {
            cx.strokeStyle = "rgba(" + tr.col + "," + (.1 + .9 * j / pasos) + ")"; cx.lineWidth = 1.2 + 1.2 * j / pasos;
            cx.beginPath(); cx.moveTo(prev[0], prev[1]); cx.lineTo(q[0], q[1]); cx.stroke();
          }
          prev = q;
        }
        if (p.s >= 0 && p.s <= tr.tot) {
          var h = punto(tr, p.s);
          cx.shadowColor = "rgba(" + tr.col + ",1)"; cx.shadowBlur = 8;
          cx.fillStyle = "#e0faff"; cx.beginPath(); cx.arc(h[0], h[1], 1.8, 0, 6.283); cx.fill();
          cx.shadowBlur = 0;
        }
      }
    }
    function bucle(ts) {
      if (!corriendo) return;
      var dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
      dibujar(dt); requestAnimationFrame(bucle);
    }
    function iniciar() { if (quieto || corriendo) return; corriendo = true; last = performance.now(); requestAnimationFrame(bucle); }
    document.addEventListener("visibilitychange", function () { if (document.hidden) corriendo = false; else iniciar(); });
    window.addEventListener("resize", medir);
    window.addEventListener("orientationchange", function () { setTimeout(medir, 250); });
    medir(); iniciar();
  })();
</script>
</body>
</html>
